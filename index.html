<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <title>Finance Sheets App</title>

  <link rel="manifest" href="manifest.json" />

  <meta name="theme-color" content="#0b1220" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>

  <style>
    :root {
      --bg: #0b1220;
      --card: #111827;
      --muted: #9ca3af;
      --border: #1f2937;
      --txt: #e5e7eb;
      --blue: #2563eb;
      --green: #16a34a;
      --red: #dc2626;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--bg);
    }

    body {
      margin: 0;
      font-family: -apple-system, system-ui, Segoe UI, Roboto, Arial;
      background: var(--bg);
      color: var(--txt);
    }

    .app {
      max-width: 520px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--bg);
      padding: calc(18px + env(safe-area-inset-top, 0px)) 16px 10px;
      font-weight: 800;
      font-size: 20px;
    }

    .content {
      flex: 1;
      padding: 12px 16px 125px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 12px;
    }

    .label {
      font-size: 12px;
      color: var(--muted);
    }

    .value {
      margin-top: 6px;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.2px;
    }

    .row {
      display: flex;
      gap: 12px;
    }

    .btn {
      flex: 1;
      background: var(--blue);
      border: none;
      color: white;
      padding: 12px 14px;
      border-radius: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .btn.secondary {
      background: var(--green);
    }

    .btn.danger {
      background: var(--red);
    }

    .btn.ghost {
      background: transparent;
      border: 1px solid #334155;
      color: var(--txt);
    }

    .nav {
      position: fixed;
      left: 8px;
      right: 8px;
      bottom: calc(8px + env(safe-area-inset-bottom));
      background: rgba(11, 18, 32, 0.96);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 18px;
      z-index: 100;
    }

    .nav-inner {
      max-width: 520px;
      margin: 0 auto;
      display: flex;
    }

    .tab {
      flex: 1;
      padding: 13px 8px;
      text-align: center;
      font-weight: 800;
      color: var(--muted);
      cursor: pointer;
      font-size: 13px;
    }

    .tab.active {
      color: var(--txt);
    }

    input,
    select {
      width: 100%;
      background: #0b1220;
      border: 1px solid #334155;
      color: var(--txt);
      padding: 11px 12px;
      border-radius: 12px;
      font-size: 16px;
    }

    input[type="checkbox"] {
      width: auto;
    }

    .field {
      margin-top: 10px;
    }

    .help {
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
      line-height: 1.4;
    }

    .error {
      background: #7f1d1d;
      border: 1px solid #991b1b;
      padding: 10px 12px;
      border-radius: 12px;
      margin-top: 10px;
    }

    .ok {
      background: #064e3b;
      border: 1px solid #065f46;
      padding: 10px 12px;
      border-radius: 12px;
      margin-top: 10px;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .pillrow {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .pill {
      font-size: 12px;
      padding: 7px 11px;
      border-radius: 999px;
      border: 1px solid #334155;
      color: var(--txt);
      background: transparent;
      cursor: pointer;
    }

    .pill.active {
      background: #1f2937;
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    .transaction-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .small-btn {
      flex: 1;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: transparent;
      color: var(--txt);
      font-weight: 700;
      cursor: pointer;
    }

    .small-btn.delete {
      border-color: #7f1d1d;
      color: #fca5a5;
    }

    .amount-expense {
      color: #f87171;
    }

    .amount-income {
      color: #4ade80;
    }

    .edit-banner {
      background: #172554;
      border: 1px solid #1d4ed8;
      padding: 10px 12px;
      border-radius: 12px;
      margin-top: 10px;
    }

    .confirm-box {
      margin-top: 10px;
      background: #450a0a;
      border: 1px solid #7f1d1d;
      border-radius: 12px;
      padding: 12px;
    }

    .donut {
      position: relative;
      width: 240px;
      max-width: 100%;
      margin: 8px auto 0;
    }

    .donut-center {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 56%;
      transform: translate(-50%, -50%);
      text-align: center;
      line-height: 1.25;
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-top: 1px solid var(--border);
    }

    .legend-row:first-child {
      border-top: none;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex: none;
    }
  </style>
</head>

<body>

<div id="root"></div>

<script>

const { useEffect, useMemo, useState } = React;


/************************************************
 * API
 ************************************************/

const API_BASE =
  "https://script.google.com/macros/s/AKfycbwjaJq8t0yUwRbOnXI80Vb0P2cffkMG3d3F75CWMwieBTBDTs0JE0cWBI_eDb1tQg4j4g/exec";


async function apiGet(path, params = {}) {

  const query = new URLSearchParams({
    path,
    ...params
  });

  const res = await fetch(
    API_BASE + "?" + query.toString(),
    {
      method: "GET"
    }
  );

  const json = await res.json();

  if (!json.ok) {
    throw new Error(json.error || "API error");
  }

  return json.data;
}


async function apiPost(path, payload = {}) {

  const res = await fetch(
    API_BASE,
    {
      method: "POST",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify({
        path,
        ...payload
      })
    }
  );

  const json = await res.json();

  if (!json.ok) {
    throw new Error(json.error || "API error");
  }

  return json.data;
}


/************************************************
 * CACHES (speed: dropdown lists load once,
 * screens show last data while refreshing)
 ************************************************/

let LISTS_PROMISE = null;
let LISTS_DATA = null;
let OVERVIEW_CACHE = null;
let INVEST_CACHE = null;
let SUBLEDGER_CACHE = null;

function getLists() {

  if (!LISTS_PROMISE) {

    LISTS_PROMISE = apiGet("lists").then(d => {
      LISTS_DATA = d;
      return d;
    }).catch(e => {
      LISTS_PROMISE = null;
      throw e;
    });
  }

  return LISTS_PROMISE;
}

function setListsCache(d) {
  LISTS_DATA = d;
  LISTS_PROMISE = Promise.resolve(d);
}

// Start loading the dropdown lists as soon as the app opens
getLists().catch(() => {});


/************************************************
 * BOTTOM NAV
 ************************************************/

function BottomNav({ tab, setTab }) {

  return React.createElement(
    "div",
    { className: "nav" },

    React.createElement(
      "div",
      { className: "nav-inner" },

      ["Overview", "Add", "Subledger", "Investments"].map(t =>
        React.createElement(
          "div",
          {
            key: t,
            className: "tab" + (tab === t ? " active" : ""),
            onClick: () => setTab(t)
          },
          t
        )
      )
    )
  );
}


/************************************************
 * OVERVIEW
 ************************************************/

function Overview({ onOpenSettings }) {

  const [data, setData] = useState(OVERVIEW_CACHE);
  const [err, setErr] = useState("");
  const [loading, setLoading] = useState(false);


  async function load() {

    setErr("");
    setLoading(true);

    try {

      const d = await apiGet("overview");

      OVERVIEW_CACHE = d;

      setData(d);

    } catch (e) {

      setErr(String(e.message || e));

    } finally {

      setLoading(false);
    }
  }


  useEffect(() => {
    load();
  }, []);


  return React.createElement(
    React.Fragment,

    null,

    React.createElement(
      "div",
      { className: "header" },
      "Overview"
    ),

    React.createElement(
      "div",
      { className: "content" },

      err
        ? React.createElement(
            "div",
            { className: "error" },
            err
          )
        : null,

      !data && loading
        ? React.createElement(
            "div",
            { className: "help" },
            "Loading..."
          )
        : null,

      data
        ? React.createElement(
            "div",
            { className: "grid" },

            metricCard("Cash", data.cash),
            metricCard("Credit card debt", data.cardDebt),
            metricCard("Expenses this month", data.currentMonthExpense),
            metricCard("Budget left today", data.budgetLeftToday)
          )
        : null,

      data && data.cards && data.cards.length
        ? React.createElement(
            "div",
            {
              className: "card",
              style: { marginTop: "12px" }
            },

            React.createElement(
              "div",
              { className: "label" },
              "Credit cards"
            ),

            data.cards.map(c =>
              React.createElement(
                "div",
                {
                  key: c.name,
                  className: "legend-row"
                },

                React.createElement(
                  "div",
                  { style: { flex: 1 } },

                  React.createElement(
                    "div",
                    { style: { fontWeight: 700 } },
                    c.name
                  ),

                  React.createElement(
                    "div",
                    { className: "help", style: { marginTop: "2px" } },
                    "Cut-off: " + c.cutOff
                  )
                ),

                React.createElement(
                  "div",
                  { style: { textAlign: "right" } },

                  React.createElement(
                    "div",
                    { className: "label" },
                    "Limit"
                  ),

                  React.createElement(
                    "div",
                    { style: { fontWeight: 800 } },
                    c.limit
                  )
                )
              )
            )
          )
        : null,

      data
        ? React.createElement(
            "div",
            { className: "help" },
            "As of: " + data.asOf
          )
        : null,

      React.createElement(
        "div",
        {
          className: "row",
          style: { marginTop: "12px" }
        },

        React.createElement(
          "button",
          {
            className: "btn ghost",
            onClick: load,
            disabled: loading
          },
          loading ? "Refreshing..." : "Refresh"
        ),

        React.createElement(
          "button",
          {
            className: "btn ghost",
            onClick: onOpenSettings
          },
          "Settings"
        )
      )
    )
  );
}


function metricCard(label, value) {

  return React.createElement(
    "div",
    { className: "card" },

    React.createElement(
      "div",
      { className: "label" },
      label
    ),

    React.createElement(
      "div",
      { className: "value" },
      value
    )
  );
}


/************************************************
 * ADD / EDIT
 ************************************************/

function Add({
  editingTransaction,
  onFinished
}) {

  const [lists, setLists] = useState(null);

  const [err, setErr] = useState("");
  const [ok, setOk] = useState("");
  const [saving, setSaving] = useState(false);

  const [mode, setMode] = useState("expense");


  /******** COMMON ********/

  const [amount, setAmount] = useState("");
  const [transactionDate, setTransactionDate] = useState(today());

  const [recognizeLater, setRecognizeLater] = useState(false);
  const [recognitionDate, setRecognitionDate] = useState("");

  const [installments, setInstallments] = useState(1);


  /******** NORMAL TRANSACTIONS ********/

  const [posName, setPosName] = useState("");
  const [description, setDescription] = useState("");
  const [paymentMethod, setPaymentMethod] = useState("");

  const [category1, setCategory1] = useState("");
  const [amount1, setAmount1] = useState("");

  const [category2, setCategory2] = useState("");
  const [amount2, setAmount2] = useState("");

  const [category3, setCategory3] = useState("");
  const [amount3, setAmount3] = useState("");

  const [useSplit, setUseSplit] = useState(false);


  /******** INVEST ********/

  const [instrument, setInstrument] = useState("");
  const [units, setUnits] = useState("");
  const [investCategory, setInvestCategory] = useState("");
  const [commission, setCommission] = useState("");


  /******** TRANSFER ********/

  const [fromAccount, setFromAccount] = useState("");
  const [toAccount, setToAccount] = useState("");


  const isEditing = !!editingTransaction;


  /******** LOAD LISTS ********/

  async function loadLists() {

    try {

      const d = await getLists();

      setLists(d);

      if (!paymentMethod && d.paymentMethods?.[0]) {
        setPaymentMethod(d.paymentMethods[0]);
      }

      if (!fromAccount && d.paymentMethods?.[0]) {
        setFromAccount(d.paymentMethods[0]);
      }

      if (!toAccount && d.paymentMethods?.[1]) {
        setToAccount(d.paymentMethods[1]);
      }

      // The dropdown showed the first category but the state stayed empty,
      // so an untouched Category I (e.g. Market) failed validation.
      if (d.expenseCategories?.[0]) {
        setCategory1(prev => prev || d.expenseCategories[0]);
      }

      if (d.investmentCategories?.[0]) {
        setInvestCategory(prev => prev || d.investmentCategories[0]);
      }

    } catch (e) {

      setErr(String(e.message || e));
    }
  }


  useEffect(() => {
    loadLists();
  }, []);


  /******** LOAD EDIT TRANSACTION ********/

  useEffect(() => {

    if (!editingTransaction) {
      return;
    }

    setErr("");
    setOk("");

    const r = editingTransaction;

    setTransactionDate(toInputDate(r.transactionDate));
    setRecognitionDate(toInputDate(r.recognitionDate));

    if (r.recognitionDate &&
        r.recognitionDate !== r.transactionDate) {

      setRecognizeLater(true);

    } else {

      setRecognizeLater(false);
    }


    if (r.transferId) {

      setMode("transfer");

      setAmount(absNumber(r.amount));

      setFromAccount(r.paymentMethod);

      /*
        The transfer pair is loaded by Subledger and the
        incoming account is provided as transferToAccount.
      */

      setToAccount(r.transferToAccount || "");

      setDescription(
        cleanTransferDescription(r.description)
      );

      return;
    }


    const type =
      r.transactionType ||
      inferTransactionType(r);

    setMode(type);

    setAmount(absNumber(r.amount));

    setPaymentMethod(r.paymentMethod || "");
    setPosName(r.posName || "");
    setDescription(r.description || "");

    setCategory1(r.category1 || "");
    setAmount1(absNumber(r.amount1));

    setCategory2(r.category2 || "");
    setAmount2(
      r.amount2 === "" ? "" : absNumber(r.amount2)
    );

    setCategory3(r.category3 || "");
    setAmount3(
      r.amount3 === "" ? "" : absNumber(r.amount3)
    );

    setUseSplit(
      !!(
        r.category2 ||
        r.category3
      )
    );


    if (type === "invest") {

      setInstrument(r.posName || "");

      const unitsMatch =
        String(r.description || "")
          .match(/^Units:\s*(.*)$/i);

      setUnits(
        unitsMatch
          ? unitsMatch[1]
          : String(absNumber(r.description))
      );

      // Column I holds the unit cost for investment rows.
      setAmount(absNumber(r.amount1));

      setInvestCategory(
        r.category1 || ""
      );
    }

  }, [editingTransaction]);


  /******** CATEGORY LIST ********/

  const categories = useMemo(() => {

    if (!lists) {
      return [];
    }

    if (mode === "expense") {
      return lists.expenseCategories || [];
    }

    if (mode === "income") {
      return lists.incomeCategories || [];
    }

    if (mode === "invest") {
      return lists.investmentCategories || [];
    }

    return [];

  }, [lists, mode]);


  /******** CHANGE MODE ********/

  function changeMode(newMode) {

    if (isEditing) {
      return;
    }

    setMode(newMode);

    setCategory2("");
    setCategory3("");

    setAmount1("");
    setAmount2("");
    setAmount3("");

    setUseSplit(false);
    setInstallments(1);
    setCommission("");

    if (lists) {

      if (newMode === "expense") {
        setCategory1(lists.expenseCategories?.[0] || "");
      }

      if (newMode === "income") {
        setCategory1(lists.incomeCategories?.[0] || "");
      }

      if (newMode === "invest") {
        const first =
          lists.investmentCategories?.[0] || "";

        setCategory1(first);
        setInvestCategory(first);
      }
    }

    if (newMode === "transfer") {

      setFromAccount(
        lists?.paymentMethods?.[0] || ""
      );

      setToAccount(
        lists?.paymentMethods?.[1] || ""
      );
    }
  }


  /******** VALIDATE ********/

  function validate() {

    const amt = Number(amount);

    if (!Number.isFinite(amt) || amt <= 0) {
      return "Amount must be a positive number.";
    }

    if (!transactionDate) {
      return "Transaction date is required.";
    }


    if (
      recognizeLater &&
      !recognitionDate
    ) {
      return "Recognition date is required.";
    }


    if (mode === "transfer") {

      if (!fromAccount) {
        return "From account is required.";
      }

      if (!toAccount) {
        return "To account is required.";
      }

      if (fromAccount === toAccount) {
        return "From and To accounts must be different.";
      }

      return null;
    }


    if (mode === "invest") {

      if (!instrument.trim()) {
        return "Instrument is required.";
      }

      if (!investCategory) {
        return "Investment category is required.";
      }

      if (!(Number(units) > 0)) {
        return "Amount (units) must be a positive number.";
      }

      if (commission !== "" && !(Number(commission) >= 0)) {
        return "Commission must be 0 or more.";
      }

      return null;
    }


    if (!paymentMethod) {
      return "Payment method is required.";
    }

    if (!posName.trim()) {
      return "POS / Business name is required.";
    }

    if (mode === "expense" && !description.trim()) {
      return "Description is required.";
    }

    if (!category1) {
      return "Category I is required.";
    }


    if (!useSplit || mode === "income") {
      return null;
    }


    const a1 = Number(amount1 || 0);
    const a2 = Number(amount2 || 0);
    const a3 = Number(amount3 || 0);

    const sum = a1 + a2 + a3;

    if (
      Math.abs(sum - amt) > 0.01
    ) {
      return "Split amounts must sum to total amount.";
    }

    if (a1 < 0 || a2 < 0 || a3 < 0) {
      return "Split amounts must be >= 0.";
    }

    if (!category2 && a2 > 0) {
      return "Category II is required if Amount II > 0.";
    }

    if (!category3 && a3 > 0) {
      return "Category III is required if Amount III > 0.";
    }

    return null;
  }


  /******** SUBMIT ********/

  async function submit() {

    setErr("");
    setOk("");

    const v = validate();

    if (v) {
      setErr(v);
      return;
    }

    setSaving(true);

    const recognition =
      recognizeLater
        ? recognitionDate
        : transactionDate;


    try {

      let payload;
      let items = null;


      /******** TRANSFER ********/

      if (mode === "transfer") {

        payload = {

          transactionType: "transfer",

          transactionId:
            editingTransaction?.transactionId || "",

          transactionDate,

          recognitionDate: recognition,

          fromAccount,
          toAccount,

          amount: Number(amount),

          description:
            description || "Transfer"
        };

      }


      /******** INVEST ********/

      else if (mode === "invest") {

        payload = {

          transactionType: "invest",

          transactionId:
            editingTransaction?.transactionId || "",

          transactionDate,

          posName: instrument,

          cost: Number(amount),

          units: Number(units),

          category1:
            investCategory || category1,

          category2: category2,

          category3: category3,

          commission: Number(commission || 0)
        };

      }


      /******** EXPENSE / INCOME ********/

      else {

        const splitOn = useSplit && mode === "expense";

        payload = {

          transactionType: mode,

          transactionId:
            editingTransaction?.transactionId || "",

          transactionDate,

          recognitionDate: recognition,

          paymentMethod,

          posName,

          amount: Number(amount),

          description:
            mode === "income"
              ? (
                  isEditing && description.trim()
                    ? description
                    : posName
                )
              : description,

          category1,

          amount1:
            splitOn
              ? Number(amount1 || 0)
              : Number(amount),

          category2:
            splitOn
              ? category2
              : "",

          amount2:
            splitOn
              ? (
                  amount2 === ""
                    ? ""
                    : Number(amount2)
                )
              : "",

          category3:
            splitOn
              ? category3
              : "",

          amount3:
            splitOn
              ? (
                  amount3 === ""
                    ? ""
                    : Number(amount3)
                )
              : ""
        };


        /******** INSTALLMENTS ********/

        const n = Number(installments);

        if (mode === "expense" && !isEditing && n > 1) {

          const total = Number(amount);

          const s1 = splitCents(splitOn ? Number(amount1 || 0) : total, n);
          const s2 = splitCents(splitOn ? Number(amount2 || 0) : 0, n);
          const s3 = splitCents(splitOn ? Number(amount3 || 0) : 0, n);

          items = s1.map((_, i) => ({

            ...payload,

            // Column C is the same for every installment,
            // column B starts at column C and moves one month at a time.
            transactionDate: addMonths(recognition, i),
            recognitionDate: recognition,

            amount: Math.round((s1[i] + s2[i] + s3[i]) * 100) / 100,

            amount1: s1[i],

            amount2:
              payload.amount2 === "" ? "" : s2[i],

            amount3:
              payload.amount3 === "" ? "" : s3[i]
          }));
        }
      }


      if (items) {

        await apiPost("append_batch", { items });

      } else if (isEditing) {

function Subledger({
  onEdit
}) {

  const [rows, setRows] = useState(SUBLEDGER_CACHE || []);
  const [err, setErr] = useState("");
  const [loading, setLoading] = useState(false);

  const [deleteTarget, setDeleteTarget] =
    useState(null);


  async function load() {

    setErr("");
    setLoading(true);

    try {

      await getLists().catch(() => {});

      const d =
        await apiGet("subledger_last");

      let loadedRows =
        d.rows || [];

      /*
        Determine transaction type and
        transfer counterpart.
      */

      loadedRows =
        enrichRows(loadedRows);

      SUBLEDGER_CACHE = loadedRows;

      setRows(loadedRows);

    } catch (e) {

      setErr(String(e.message || e));

    } finally {

      setLoading(false);
    }
  }


  useEffect(() => {
    load();
  }, []);


  async function confirmDelete() {

    if (!deleteTarget) {
      return;
    }

    setErr("");

    try {

      await apiPost(
        "delete",
        {
          transactionId:
            deleteTarget.transactionId
        }
      );

      setDeleteTarget(null);

      await load();

    } catch (e) {

      setErr(String(e.message || e));
    }
  }


  return React.createElement(
    React.Fragment,

    null,

    React.createElement(
      "div",
      { className: "header" },
      "Subledger (last 100)"
    ),

    React.createElement(
      "div",
      { className: "content" },

      err
        ? React.createElement(
            "div",
            { className: "error" },
            err
          )

      React.createElement(

        {
          className: "row",
          style: { marginBottom: "12px" }
        },

        React.createElement(
          "button",

function Donut({ slices, children }) {

  const R = 76;
  const C = 2 * Math.PI * R;

  const sum = slices.reduce(
    (s, x) => s + Math.max(x.value, 0),
    0
  );

  let cum = 0;

  const arcs = sum > 0
    ? slices.map(x => {

        const len = (Math.max(x.value, 0) / sum) * C;

        const el = React.createElement(
          "circle",
          {
            key: x.label,
            cx: 100,
            cy: 100,
            r: R,
            fill: "none",
            stroke: x.color,
            strokeWidth: 30,
            strokeDasharray:
              Math.max(len - 1.5, 0) + " " + (C - Math.max(len - 1.5, 0)),
            strokeDashoffset: -cum,
            transform: "rotate(-90 100 100)"
          }
        );

        cum += len;

        return el;
      })
    : [
        React.createElement(
          "circle",
          {
            key: "empty",
            cx: 100,
            cy: 100,
            r: R,
            fill: "none",
            stroke: "#1f2937",
            strokeWidth: 30
          }
        )
      ];

  return React.createElement(
    "div",
    { className: "donut" },

    React.createElement(
      "svg",
      {
        viewBox: "0 0 200 200",
        width: "100%"

/************************************************

 ************************************************/

const LIST_KINDS_UI = [
  { key: "payment", label: "Payment methods", names: "paymentMethods", hasType: true },
  { key: "expense", label: "Expense categories", names: "expenseCategories", hasType: true },
  { key: "income", label: "Income categories", names: "incomeCategories", hasType: true },
  { key: "investment", label: "Invest categories", names: "investmentCategories", hasType: false }
];


function Settings({ onBack }) {

  const [lists, setLists] = useState(LISTS_DATA);
  const [kind, setKind] = useState("payment");
  const [name, setName] = useState("");
  const [type, setType] = useState("Debit");
  const [err, setErr] = useState("");
  const [ok, setOk] = useState("");
  const [busy, setBusy] = useState(false);
  const [confirm, setConfirm] = useState(null);


  useEffect(() => {

    apiGet("lists")
      .then(d => {
        setListsCache(d);
        setLists(d);
      })
      .catch(e => setErr(String(e.message || e)));

  }, []);


  const cfg = LIST_KINDS_UI.find(k => k.key === kind);

  const items = lists?.[cfg.names] || [];


  async function addItem() {

    setErr("");
    setOk("");

    if (!name.trim()) {
      setErr("Name is required.");
      return;
    }

    setBusy(true);

    try {

      const d = await apiPost(
        "list_add",
        {
          kind,
          name: name.trim(),
          type
        }
      );

      setListsCache(d);
      setLists(d);
      setName("");
      setOk("Added ✅");

    } catch (e) {

      setErr(String(e.message || e));

    } finally {

      setBusy(false);
    }
  }


  async function deleteItem() {

    if (!confirm) {
      return;
    }

    setErr("");
    setOk("");
    setBusy(true);

    try {

      const d = await apiPost(
        "list_delete",
        {
          kind,
          name: confirm
        }
      );

      setListsCache(d);
      setLists(d);
      setConfirm(null);
      setOk("Deleted ✅");

    } catch (e) {

      setErr(String(e.message || e));

    } finally {

      setBusy(false);
    }
  }


  return React.createElement(
    React.Fragment,

    null,

    React.createElement(
      "div",
      { className: "header" },
      "Settings"
    ),

    React.createElement(
      "div",
      { className: "content" },

      React.createElement(
        "div",
        { className: "row" },

        React.createElement(
          "button",
          {
            className: "btn ghost",
            onClick: onBack
          },
          "← Back"
        )
      ),

      err
        ? React.createElement("div", { className: "error" }, err)
        : null,

      ok
        ? React.createElement("div", { className: "ok" }, ok)
        : null,


      React.createElement(
        "div",
        { className: "pillrow" },

        LIST_KINDS_UI.map(k =>
          React.createElement(
            "button",
            {
              key: k.key,
              className:
                "pill" +
                (kind === k.key ? " active" : ""),
              onClick: () => {
                setKind(k.key);
                setConfirm(null);
                setErr("");
                setOk("");
              }
            },
            k.label
          )
        )
      ),


      React.createElement(
        "div",
        {
          className: "card",
          style: { marginTop: "12px" }
        },

        React.createElement(
          "div",
          { className: "label" },
          "Add to " + cfg.label.toLowerCase()
        ),

        React.createElement(
          "div",
          { className: "field" },

          React.createElement(
            "input",
            {
              value: name,
              onChange: e => setName(e.target.value),
              placeholder: "Name"
            }
          )
        ),

        cfg.hasType
          ? React.createElement(
              "div",
              { className: "field" },

              React.createElement(
                "select",
                {
                  value: type,
                  onChange: e => setType(e.target.value)
                },

                React.createElement("option", { value: "Debit" }, "Debit"),
                React.createElement("option", { value: "Credit" }, "Credit")
              )
            )
          : null,

        React.createElement(
          "div",
          {
            className: "row",
            style: { marginTop: "12px" }
          },

          React.createElement(
            "button",
            {
              className: "btn",
              onClick: addItem,
              disabled: busy
            },
            busy ? "Working..." : "Add"
          )
        )
      ),


      confirm
        ? React.createElement(
            "div",
            { className: "confirm-box" },

            React.createElement(
              "div",
              { style: { fontWeight: 800 } },
              "Delete \"" + confirm + "\"?"
            ),

            React.createElement(
              "div",
              { className: "help" },
              "It is removed from the Siniflandirma sheet. Existing Muavin rows keep their text."
            ),

            React.createElement(
              "div",
              {
                className: "row",
                style: { marginTop: "10px" }
              },

              React.createElement(
                "button",
                {
                  className: "btn danger",
                  onClick: deleteItem,
                  disabled: busy
                },
                "Delete"
              ),

              React.createElement(
                "button",
                {
                  className: "btn ghost",
                  onClick: () => setConfirm(null)
                },
                "Cancel"
              )
            )
          )
        : null,


      React.createElement(
        "div",
        {
          className: "card",
          style: { marginTop: "12px" }
        },

        React.createElement(
          "div",
          { className: "label" },
          cfg.label + " (" + items.length + ")"
        ),

        items.length === 0
          ? React.createElement(
              "div",
              { className: "help" },
              lists ? "No items." : "Loading..."
            )
          : null,

        items.map(item =>
          React.createElement(
            "div",
            {
              key: item,
              className: "legend-row"
            },

            React.createElement(
              "div",
              { style: { flex: 1, fontWeight: 700 } },
              item
            ),

            cfg.hasType
              ? React.createElement(
                  "div",
                  { className: "help", style: { margin: 0 } },
                  (lists?.types?.[kind]?.[item] || "") === "credit"
                    ? "Credit"
                    : "Debit"
                )
              : null,

            React.createElement(
              "button",
              {
                className: "small-btn delete",
                style: { flex: "none" },
                onClick: () => setConfirm(item)
              },
              "Delete"
            )
          )
        )
      )
    )
  );
}

function App() {

  const [tab, setTab] =
    useState("Overview");

  const [editingTransaction, setEditingTransaction] =
    useState(null);


  function startEdit(transaction) {

    setEditingTransaction(transaction);
    setTab("Add");
  }


  function finishEdit() {

    setEditingTransaction(null);
    setTab("Subledger");
  }


  let screen;


  if (tab === "Overview") {

    screen =
      React.createElement(
        Overview,
        {
          onOpenSettings: () => setTab("Settings")
        }
      );

  } else if (tab === "Add") {

    screen =
      React.createElement(
        Add,
        {
          editingTransaction,
          onFinished: finishEdit
        }
      );

  } else if (tab === "Subledger") {

    screen =
      React.createElement(
        Subledger,
        {
          onEdit: startEdit
        }
      );

  } else if (tab === "Settings") {

    screen =
      React.createElement(
        Settings,
        {
          onBack: () => setTab("Overview")
        }
      );

  } else {

    screen =
      React.createElement(
        Investments
      );
  }


  return React.createElement(
    "div",
    { className: "app" },

    screen,

    React.createElement(
      BottomNav,
      {
        tab,
        setTab: (newTab) => {

          if (newTab !== "Add") {
            setEditingTransaction(null);
          }

          setTab(newTab);
        }
      }
    )
  );
}


/************************************************
 * HELPERS
 ************************************************/

function today() {

  const d = new Date();

  const y =
    d.getFullYear();

  const m =
    String(d.getMonth() + 1)
      .padStart(2, "0");

  const day =
    String(d.getDate())
      .padStart(2, "0");

  return `${y}-${m}-${day}`;
}


// Adds k months to a yyyy-mm-dd string (day is clamped to month end).
function addMonths(dateStr, k) {

  const p = String(dateStr).split("-").map(Number);

  const y = p[0];
  const m = p[1] - 1;
  const d = p[2];

  const lastDay = new Date(y, m + k + 1, 0).getDate();

  const t = new Date(y, m + k, Math.min(d, lastDay));

  return (
    t.getFullYear() + "-" +
    String(t.getMonth() + 1).padStart(2, "0") + "-" +
    String(t.getDate()).padStart(2, "0")
  );
}


// Splits a total into n parts in cents; leftover cents go to the first parts.
function splitCents(total, n) {

  const c = Math.round(Number(total || 0) * 100);

  const base = Math.floor(c / n);
  const rem = c - base * n;

  return Array.from(
    { length: n },
    (_, i) => (base + (i < rem ? 1 : 0)) / 100
  );
}


function toInputDate(value) {

  if (!value) {
    return "";
  }

  const s = String(value);

  /*
    Handles yyyy-mm-dd directly.
  */

  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) {
    return s;
  }

  /*
    Handles common dd/mm/yyyy display values.
  */

  const parts =
    s.split("/");

  if (parts.length === 3) {

    const day = parts[0].padStart(2, "0");
    const month = parts[1].padStart(2, "0");
    const year = parts[2];

    if (year.length === 4) {
      return `${year}-${month}-${day}`;
    }
  }

  return "";
}


function absNumber(value) {

  if (
    value === "" ||
    value === null ||
    value === undefined
  ) {
    return "";
  }

  const cleaned =
    String(value)
      .replace(/,/g, "")
      .replace(/[^\d.-]/g, "");

  const n = Number(cleaned);

  return Number.isFinite(n)
    ? Math.abs(n)
    : "";
}


function inferTransactionType(r) {

  if (r.transferId) {
    return "transfer";
  }

  /*
    Existing rows don't have a transaction-type column.

    For old data, negative amount = expense,
    positive amount = income.

    Investment rows are recognized by
    paymentMethod === "Investment".
  */

  if (
    String(r.paymentMethod)
      .toLowerCase() === "investment"
  ) {
    return "invest";
  }

  if (
    LISTS_DATA &&
    (LISTS_DATA.investmentCategories || []).includes(r.category1)
  ) {
    return "invest";
  }

  /*
    Amount sign no longer identifies the type (a card expense is
    positive), so the category lists decide first.
  */

  if (LISTS_DATA) {

    const inExpense =
      (LISTS_DATA.expenseCategories || []).includes(r.category1);

    const inIncome =
      (LISTS_DATA.incomeCategories || []).includes(r.category1);

    if (inExpense && !inIncome) {
      return "expense";
    }

    if (inIncome && !inExpense) {
      return "income";
    }
  }

  const n =
    Number(
      String(r.amount)
        .replace(/,/g, "")
        .replace(/[^\d.-]/g, "")
    );

  return n < 0
    ? "expense"
    : "income";
}


function cleanTransferDescription(description) {

  return String(description || "")
    .replace(/\s+[→←]\s+.*$/, "")
    .trim();
}


function enrichRows(rows) {

  const transferGroups = {};

  rows.forEach(r => {

    if (r.transferId) {

      if (!transferGroups[r.transferId]) {
        transferGroups[r.transferId] = [];
      }

      transferGroups[r.transferId].push(r);
    }
  });


  return rows.map(r => {

    const enriched = {
      ...r,
      transactionType:
        inferTransactionType(r)
    };


    if (r.transferId) {

      const group =
        transferGroups[r.transferId] || [];

      const counterpart =
        group.find(
          x =>
            x.transactionId !==
            r.transactionId
        );

      if (counterpart) {

        enriched.transferToAccount =
          counterpart.paymentMethod;
      }
    }

    return enriched;
  });
}
