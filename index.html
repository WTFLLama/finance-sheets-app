<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <title>Finance Sheets App</title>

  <link rel="manifest" href="manifest.json" />

  <meta name="theme-color" content="#0b1220" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>

  <style>
    :root {
      --bg: #0b1220;
      --card: #111827;
      --muted: #9ca3af;
      --border: #1f2937;
      --txt: #e5e7eb;
      --blue: #2563eb;
      --green: #16a34a;
      --red: #dc2626;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, system-ui, Segoe UI, Roboto, Arial;
      background: var(--bg);
      color: var(--txt);
    }

    .app {
      max-width: 520px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 18px 16px 10px;
      font-weight: 800;
      font-size: 20px;
    }

    .content {
      flex: 1;
      padding: 12px 16px 125px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 12px;
    }

    .label {
      font-size: 12px;
      color: var(--muted);
    }

    .value {
      margin-top: 6px;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.2px;
    }

    .row {
      display: flex;
      gap: 12px;
    }

    .btn {
      flex: 1;
      background: var(--blue);
      border: none;
      color: white;
      padding: 12px 14px;
      border-radius: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .btn.secondary {
      background: var(--green);
    }

    .btn.danger {
      background: var(--red);
    }

    .btn.ghost {
      background: transparent;
      border: 1px solid #334155;
      color: var(--txt);
    }

    .nav {
      position: fixed;
      left: 8px;
      right: 8px;
      bottom: calc(8px + env(safe-area-inset-bottom));
      background: rgba(11, 18, 32, 0.96);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 18px;
      z-index: 100;
    }

    .nav-inner {
      max-width: 520px;
      margin: 0 auto;
      display: flex;
    }

    .tab {
      flex: 1;
      padding: 13px 8px;
      text-align: center;
      font-weight: 800;
      color: var(--muted);
      cursor: pointer;
      font-size: 13px;
    }

    .tab.active {
      color: var(--txt);
    }

    input,
    select {
      width: 100%;
      background: #0b1220;
      border: 1px solid #334155;
      color: var(--txt);
      padding: 11px 12px;
      border-radius: 12px;
      font-size: 16px;
    }

    input[type="checkbox"] {
      width: auto;
    }

    .field {
      margin-top: 10px;
    }

    .help {
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
      line-height: 1.4;
    }

    .error {
      background: #7f1d1d;
      border: 1px solid #991b1b;
      padding: 10px 12px;
      border-radius: 12px;
      margin-top: 10px;
    }

    .ok {
      background: #064e3b;
      border: 1px solid #065f46;
      padding: 10px 12px;
      border-radius: 12px;
      margin-top: 10px;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .pillrow {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .pill {
      font-size: 12px;
      padding: 7px 11px;
      border-radius: 999px;
      border: 1px solid #334155;
      color: var(--txt);
      background: transparent;
      cursor: pointer;
    }

    .pill.active {
      background: #1f2937;
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    .transaction-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .small-btn {
      flex: 1;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: transparent;
      color: var(--txt);
      font-weight: 700;
      cursor: pointer;
    }

    .small-btn.delete {
      border-color: #7f1d1d;
      color: #fca5a5;
    }

    .amount-expense {
      color: #f87171;
    }

    .amount-income {
      color: #4ade80;
    }

    .edit-banner {
      background: #172554;
      border: 1px solid #1d4ed8;
      padding: 10px 12px;
      border-radius: 12px;
      margin-top: 10px;
    }

    .confirm-box {
      margin-top: 10px;
      background: #450a0a;
      border: 1px solid #7f1d1d;
      border-radius: 12px;
      padding: 12px;
    }
  </style>
</head>

<body>

<div id="root"></div>

<script>

const { useEffect, useMemo, useState } = React;


/************************************************
 * API
 ************************************************/

const API_BASE =
  "https://script.google.com/macros/s/AKfycbyxSj5NiSuGcP1-ieqva0K1_MOAouAhCsOIDbKnoxpfsd76YmvvovYZWmEfqKIcPKE-fg/exec";


async function apiGet(path, params = {}) {

  const query = new URLSearchParams({
    path,
    ...params
  });

  const res = await fetch(
    API_BASE + "?" + query.toString(),
    {
      method: "GET"
    }
  );

  const json = await res.json();

  if (!json.ok) {
    throw new Error(json.error || "API error");
  }

  return json.data;
}


async function apiPost(path, payload = {}) {

  const res = await fetch(
    API_BASE,
    {
      method: "POST",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify({
        path,
        ...payload
      })
    }
  );

  const json = await res.json();

  if (!json.ok) {
    throw new Error(json.error || "API error");
  }

  return json.data;
}


/************************************************
 * BOTTOM NAV
 ************************************************/

function BottomNav({ tab, setTab }) {

  return React.createElement(
    "div",
    { className: "nav" },

    React.createElement(
      "div",
      { className: "nav-inner" },

      ["Overview", "Add", "Subledger", "Reports"].map(t =>
        React.createElement(
          "div",
          {
            key: t,
            className: "tab" + (tab === t ? " active" : ""),
            onClick: () => setTab(t)
          },
          t
        )
      )
    )
  );
}


/************************************************
 * OVERVIEW
 ************************************************/

function Overview() {

  const [data, setData] = useState(null);
  const [err, setErr] = useState("");
  const [loading, setLoading] = useState(false);


  async function load() {

    setErr("");
    setLoading(true);

    try {

      const d = await apiGet("overview");

      setData(d);

    } catch (e) {

      setErr(String(e.message || e));

    } finally {

      setLoading(false);
    }
  }


  useEffect(() => {
    load();
  }, []);


  return React.createElement(
    React.Fragment,

    null,

    React.createElement(
      "div",
      { className: "header" },
      "Overview"
    ),

    React.createElement(
      "div",
      { className: "content" },

      err
        ? React.createElement(
            "div",
            { className: "error" },
            err
          )
        : null,

      !data && loading
        ? React.createElement(
            "div",
            { className: "help" },
            "Loading..."
          )
        : null,

      data
        ? React.createElement(
            "div",
            { className: "grid" },

            metricCard("Bank balance", data.bankBalance),
            metricCard("Card remaining limit", data.cardRemainingLimit),
            metricCard("Card liability", data.cardLiability),
            metricCard("Investments", data.investmentBalance)
          )
        : null,

      data
        ? React.createElement(
            "div",
            {
              className: "card",
              style: { marginTop: "12px" }
            },

            React.createElement(
              "div",
              { className: "label" },
              "Expenses this month"
            ),

            React.createElement(
              "div",
              { className: "value" },
              data.currentMonthExpense
            ),

            React.createElement(
              "div",
              { className: "help" },
              "As of: " + data.asOf
            )
          )
        : null,

      React.createElement(
        "div",
        {
          className: "row",
          style: { marginTop: "12px" }
        },

        React.createElement(
          "button",
          {
            className: "btn ghost",
            onClick: load,
            disabled: loading
          },
          loading ? "Refreshing..." : "Refresh"
        )
      )
    )
  );
}


function metricCard(label, value) {

  return React.createElement(
    "div",
    { className: "card" },

    React.createElement(
      "div",
      { className: "label" },
      label
    ),

    React.createElement(
      "div",
      { className: "value" },
      value
    )
  );
}


/************************************************
 * ADD / EDIT
 ************************************************/

function Add({
  editingTransaction,
  onFinished
}) {

  const [lists, setLists] = useState(null);

  const [err, setErr] = useState("");
  const [ok, setOk] = useState("");
  const [saving, setSaving] = useState(false);

  const [mode, setMode] = useState("expense");


  /******** COMMON ********/

  const [amount, setAmount] = useState("");
  const [transactionDate, setTransactionDate] = useState(today());

  const [recognizeLater, setRecognizeLater] = useState(false);
  const [recognitionDate, setRecognitionDate] = useState("");


  /******** NORMAL TRANSACTIONS ********/

  const [posName, setPosName] = useState("");
  const [description, setDescription] = useState("");
  const [paymentMethod, setPaymentMethod] = useState("");

  const [category1, setCategory1] = useState("");
  const [amount1, setAmount1] = useState("");

  const [category2, setCategory2] = useState("");
  const [amount2, setAmount2] = useState("");

  const [category3, setCategory3] = useState("");
  const [amount3, setAmount3] = useState("");

  const [useSplit, setUseSplit] = useState(false);


  /******** INVEST ********/

  const [instrument, setInstrument] = useState("");
  const [units, setUnits] = useState("");
  const [investCategory, setInvestCategory] = useState("");


  /******** TRANSFER ********/

  const [fromAccount, setFromAccount] = useState("");
  const [toAccount, setToAccount] = useState("");


  const isEditing = !!editingTransaction;


  /******** LOAD LISTS ********/

  async function loadLists() {

    try {

      const d = await apiGet("lists");

      setLists(d);

      if (!paymentMethod && d.paymentMethods?.[0]) {
        setPaymentMethod(d.paymentMethods[0]);
      }

      if (!fromAccount && d.paymentMethods?.[0]) {
        setFromAccount(d.paymentMethods[0]);
      }

      if (!toAccount && d.paymentMethods?.[1]) {
        setToAccount(d.paymentMethods[1]);
      }

    } catch (e) {

      setErr(String(e.message || e));
    }
  }


  useEffect(() => {
    loadLists();
  }, []);


  /******** LOAD EDIT TRANSACTION ********/

  useEffect(() => {

    if (!editingTransaction) {
      return;
    }

    setErr("");
    setOk("");

    const r = editingTransaction;

    setTransactionDate(toInputDate(r.transactionDate));
    setRecognitionDate(toInputDate(r.recognitionDate));

    if (r.recognitionDate &&
        r.recognitionDate !== r.transactionDate) {

      setRecognizeLater(true);

    } else {

      setRecognizeLater(false);
    }


    if (r.transferId) {

      setMode("transfer");

      setAmount(absNumber(r.amount));

      setFromAccount(r.paymentMethod);

      /*
        The transfer pair is loaded by Subledger and the
        incoming account is provided as transferToAccount.
      */

      setToAccount(r.transferToAccount || "");

      setDescription(
        cleanTransferDescription(r.description)
      );

      return;
    }


    const type =
      r.transactionType ||
      inferTransactionType(r);

    setMode(type);

    setAmount(absNumber(r.amount));

    setPaymentMethod(r.paymentMethod || "");
    setPosName(r.posName || "");
    setDescription(r.description || "");

    setCategory1(r.category1 || "");
    setAmount1(absNumber(r.amount1));

    setCategory2(r.category2 || "");
    setAmount2(
      r.amount2 === "" ? "" : absNumber(r.amount2)
    );

    setCategory3(r.category3 || "");
    setAmount3(
      r.amount3 === "" ? "" : absNumber(r.amount3)
    );

    setUseSplit(
      !!(
        r.category2 ||
        r.category3
      )
    );


    if (type === "invest") {

      setInstrument(r.posName || "");

      const unitsMatch =
        String(r.description || "")
          .match(/^Units:\s*(.*)$/i);

      setUnits(
        unitsMatch ? unitsMatch[1] : ""
      );

      setInvestCategory(
        r.category1 || ""
      );
    }

  }, [editingTransaction]);


  /******** CATEGORY LIST ********/

  const categories = useMemo(() => {

    if (!lists) {
      return [];
    }

    if (mode === "expense") {
      return lists.expenseCategories || [];
    }

    if (mode === "income") {
      return lists.incomeCategories || [];
    }

    if (mode === "invest") {
      return lists.investmentCategories || [];
    }

    return [];

  }, [lists, mode]);


  /******** CHANGE MODE ********/

  function changeMode(newMode) {

    if (isEditing) {
      return;
    }

    setMode(newMode);

    setCategory2("");
    setCategory3("");

    setAmount1("");
    setAmount2("");
    setAmount3("");

    setUseSplit(false);

    if (lists) {

      if (newMode === "expense") {
        setCategory1(lists.expenseCategories?.[0] || "");
      }

      if (newMode === "income") {
        setCategory1(lists.incomeCategories?.[0] || "");
      }

      if (newMode === "invest") {
        const first =
          lists.investmentCategories?.[0] || "";

        setCategory1(first);
        setInvestCategory(first);
      }
    }

    if (newMode === "transfer") {

      setFromAccount(
        lists?.paymentMethods?.[0] || ""
      );

      setToAccount(
        lists?.paymentMethods?.[1] || ""
      );
    }
  }


  /******** VALIDATE ********/

  function validate() {

    const amt = Number(amount);

    if (!Number.isFinite(amt) || amt <= 0) {
      return "Amount must be a positive number.";
    }

    if (!transactionDate) {
      return "Transaction date is required.";
    }


    if (
      recognizeLater &&
      !recognitionDate
    ) {
      return "Recognition date is required.";
    }


    if (mode === "transfer") {

      if (!fromAccount) {
        return "From account is required.";
      }

      if (!toAccount) {
        return "To account is required.";
      }

      if (fromAccount === toAccount) {
        return "From and To accounts must be different.";
      }

      return null;
    }


    if (mode === "invest") {

      if (!instrument.trim()) {
        return "Instrument is required.";
      }

      if (!investCategory) {
        return "Investment category is required.";
      }

      return null;
    }


    if (!paymentMethod) {
      return "Payment method is required.";
    }

    if (!posName.trim()) {
      return "POS / Business name is required.";
    }

    if (!description.trim()) {
      return "Description is required.";
    }

    if (!category1) {
      return "Category I is required.";
    }


    if (!useSplit) {
      return null;
    }


    const a1 = Number(amount1 || 0);
    const a2 = Number(amount2 || 0);
    const a3 = Number(amount3 || 0);

    const sum = a1 + a2 + a3;

    if (
      Math.abs(sum - amt) > 0.01
    ) {
      return "Split amounts must sum to total amount.";
    }

    if (a1 < 0 || a2 < 0 || a3 < 0) {
      return "Split amounts must be >= 0.";
    }

    if (!category2 && a2 > 0) {
      return "Category II is required if Amount II > 0.";
    }

    if (!category3 && a3 > 0) {
      return "Category III is required if Amount III > 0.";
    }

    return null;
  }


  /******** SUBMIT ********/

  async function submit() {

    setErr("");
    setOk("");

    const v = validate();

    if (v) {
      setErr(v);
      return;
    }

    setSaving(true);

    const recognition =
      recognizeLater
        ? recognitionDate
        : transactionDate;


    try {

      let payload;


      /******** TRANSFER ********/

      if (mode === "transfer") {

        payload = {

          transactionType: "transfer",

          transactionId:
            editingTransaction?.transactionId || "",

          transactionDate,

          recognitionDate: recognition,

          fromAccount,
          toAccount,

          amount: Number(amount),

          description:
            description || "Transfer"
        };

      }


      /******** INVEST ********/

      else if (mode === "invest") {

        payload = {

          transactionType: "invest",

          transactionId:
            editingTransaction?.transactionId || "",

          transactionDate,

          recognitionDate: "",

          paymentMethod: "Investment",

          posName: instrument,

          amount: Number(amount),

          description:
            units
              ? "Units: " + units
              : "Investment purchase",

          category1:
            investCategory || category1,

          amount1: Number(amount),

          category2: "",
          amount2: "",

          category3: "",
          amount3: ""
        };

      }


      /******** EXPENSE / INCOME ********/

      else {

        payload = {

          transactionType: mode,

          transactionId:
            editingTransaction?.transactionId || "",

          transactionDate,

          recognitionDate: recognition,

          paymentMethod,

          posName,

          amount: Number(amount),

          description,

          category1,

          amount1:
            useSplit
              ? Number(amount1 || 0)
              : Number(amount),

          category2:
            useSplit
              ? category2
              : "",

          amount2:
            useSplit
              ? (
                  amount2 === ""
                    ? ""
                    : Number(amount2)
                )
              : "",

          category3:
            useSplit
              ? category3
              : "",

          amount3:
            useSplit
              ? (
                  amount3 === ""
                    ? ""
                    : Number(amount3)
                )
              : ""
        };
      }


      const result = isEditing
        ? await apiPost("edit", payload)
        : await apiPost("append", payload);


      setOk(
        isEditing
          ? "Updated successfully ✅"
          : "Saved successfully ✅"
      );


      resetForm();


      if (onFinished) {
        setTimeout(() => {
          onFinished();
        }, 500);
      }

    } catch (e) {

      setErr(String(e.message || e));

    } finally {

      setSaving(false);
    }
  }


  /******** RESET ********/

  function resetForm() {

    setAmount("");
    setTransactionDate(today());

    setRecognizeLater(false);
    setRecognitionDate("");

    setPosName("");
    setDescription("");

    setCategory2("");
    setAmount2("");

    setCategory3("");
    setAmount3("");

    setUseSplit(false);

    setInstrument("");
    setUnits("");

    if (lists) {

      setCategory1(
        lists.expenseCategories?.[0] || ""
      );

      setInvestCategory(
        lists.investmentCategories?.[0] || ""
      );

      setPaymentMethod(
        lists.paymentMethods?.[0] || ""
      );

      setFromAccount(
        lists.paymentMethods?.[0] || ""
      );

      setToAccount(
        lists.paymentMethods?.[1] || ""
      );
    }

    if (!isEditing) {
      setMode("expense");
    }
  }


  const isExpInc =
    mode === "expense" ||
    mode === "income";


  return React.createElement(
    React.Fragment,

    null,

    React.createElement(
      "div",
      { className: "header" },
      isEditing ? "Edit transaction" : "Add entry"
    ),

    React.createElement(
      "div",
      { className: "content" },

      err
        ? React.createElement(
            "div",
            { className: "error" },
            err
          )
        : null,

      ok
        ? React.createElement(
            "div",
            { className: "ok" },
            ok
          )
        : null,


      isEditing
        ? React.createElement(
            "div",
            { className: "edit-banner" },
            "Editing: ",
            React.createElement(
              "span",
              { className: "mono" },
              editingTransaction.transactionId
            )
          )
        : null,


      /******** MODE ********/

      React.createElement(
        "div",
        { className: "pillrow" },

        ["expense", "income", "transfer", "invest"].map(m =>

          React.createElement(
            "button",
            {
              key: m,
              className:
                "pill" +
                (mode === m ? " active" : ""),
              onClick: () => changeMode(m),
              disabled: isEditing
            },

            m === "expense"
              ? "Expense"
              : m === "income"
                ? "Income"
                : m === "transfer"
                  ? "Transfer"
                  : "Invest"
          )
        )
      ),


      /******** AMOUNT ********/

      React.createElement(
        "div",
        { className: "field" },

        React.createElement(
          "div",
          { className: "label" },
          mode === "invest"
            ? "Cost (TL)"
            : "Amount (TRY)"
        ),

        React.createElement(
          "input",
          {
            value: amount,
            onChange: e => setAmount(e.target.value),
            inputMode: "decimal",
            placeholder: "e.g. 500"
          }
        )
      ),


      /******** TRANSFER ********/

      mode === "transfer"
        ? React.createElement(
            React.Fragment,
            null,

            React.createElement(
              "div",
              { className: "field" },

              React.createElement(
                "div",
                { className: "label" },
                "From account"
              ),

              React.createElement(
                "select",
                {
                  value: fromAccount,
                  onChange:
                    e => setFromAccount(e.target.value)
                },

                (lists?.paymentMethods || []).map(p =>
                  React.createElement(
                    "option",
                    {
                      key: p,
                      value: p
                    },
                    p
                  )
                )
              )
            ),

            React.createElement(
              "div",
              { className: "field" },

              React.createElement(
                "div",
                { className: "label" },
                "To account"
              ),

              React.createElement(
                "select",
                {
                  value: toAccount,
                  onChange:
                    e => setToAccount(e.target.value)
                },

                (lists?.paymentMethods || []).map(p =>
                  React.createElement(
                    "option",
                    {
                      key: p,
                      value: p
                    },
                    p
                  )
                )
              )
            ),

            React.createElement(
              "div",
              { className: "help" },

            )

function Subledger({
  onEdit
}) {

  const [rows, setRows] = useState([]);
  const [err, setErr] = useState("");
  const [loading, setLoading] = useState(false);

  const [deleteTarget, setDeleteTarget] =
    useState(null);


  async function load() {

    setErr("");
    setLoading(true);

    try {

      const d =
        await apiGet("subledger_last");

      let loadedRows =
        d.rows || [];

      /*
        Determine transaction type and
        transfer counterpart.
      */

      loadedRows =
        enrichRows(loadedRows);

      setRows(loadedRows);

    } catch (e) {

      setErr(String(e.message || e));

    } finally {

      setLoading(false);
    }
  }


  useEffect(() => {
    load();
  }, []);


  async function confirmDelete() {

    if (!deleteTarget) {
      return;
    }

    setErr("");

    try {

      await apiPost(
        "delete",
        {
          transactionId:
            deleteTarget.transactionId
        }
      );

      setDeleteTarget(null);

      await load();

    } catch (e) {

      setErr(String(e.message || e));
    }
  }


  return React.createElement(
    React.Fragment,

    null,

    React.createElement(
      "div",
      { className: "header" },
      "Subledger (last 100)"
    ),

    React.createElement(
      "div",
      { className: "content" },

      err
        ? React.createElement(
            "div",
            { className: "error" },
            err
          )
        : null,


      React.createElement(
        "div",
        {
          className: "row",
          style: { marginBottom: "12px" }
        },

        React.createElement(
          "button",
          {
            className: "btn ghost",
            onClick: load,
            disabled: loading
          },
          loading ? "Refreshing..." : "Refresh"
        )
      ),


      deleteTarget
        ? React.createElement(
            "div",
            { className: "confirm-box" },

            React.createElement(
              "div",
              { style: { fontWeight: 800 } },
              deleteTarget.transferId
                ? "Delete this transfer?"

            React.createElement(
              "div",
              { className: "help" },
              deleteTarget.transferId
                ? "Both sides of the transfer will be deleted."
                : "This transaction will be permanently removed from Muavin."
            ),

            React.createElement(
              "div",
              {
                className: "row",
                style: { marginTop: "10px" }
              },

              React.createElement(
                "button",
                {
                  className: "btn danger",
                  onClick: confirmDelete

/************************************************
 * HELPERS
 ************************************************/

function today() {

  const d = new Date();

  const y =
    d.getFullYear();

  const m =
    String(d.getMonth() + 1)
      .padStart(2, "0");

  const day =
    String(d.getDate())
      .padStart(2, "0");

  return `${y}-${m}-${day}`;
}


function toInputDate(value) {

  if (!value) {
    return "";
  }

  const s = String(value);

  /*
    Handles yyyy-mm-dd directly.
  */

  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) {
    return s;
  }

  /*
    Handles common dd/mm/yyyy display values.
  */

  const parts =
    s.split("/");

  if (parts.length === 3) {

    const day = parts[0].padStart(2, "0");
    const month = parts[1].padStart(2, "0");
    const year = parts[2];

    if (year.length === 4) {
      return `${year}-${month}-${day}`;
    }
  }

  return "";
}


function absNumber(value) {

  if (
    value === "" ||
    value === null ||
    value === undefined
  ) {
    return "";
  }

  const cleaned =
    String(value)
      .replace(/,/g, "")
      .replace(/[^\d.-]/g, "");

  const n = Number(cleaned);

  return Number.isFinite(n)
    ? Math.abs(n)
    : "";
}


function inferTransactionType(r) {

  if (r.transferId) {
    return "transfer";
  }

  /*
    Existing rows don't have a transaction-type column.

    For old data, negative amount = expense,
    positive amount = income.

    Investment rows are recognized by
    paymentMethod === "Investment".
  */

  if (
    String(r.paymentMethod)
      .toLowerCase() === "investment"
  ) {
    return "invest";
  }

  const n =
    Number(
      String(r.amount)
        .replace(/,/g, "")
        .replace(/[^\d.-]/g, "")
    );

  return n < 0
    ? "expense"
    : "income";
}


function cleanTransferDescription(description) {

  return String(description || "")
    .replace(/\s+[→←]\s+.*$/, "")
    .trim();
}


function enrichRows(rows) {

  const transferGroups = {};

  rows.forEach(r => {

    if (r.transferId) {

      if (!transferGroups[r.transferId]) {
        transferGroups[r.transferId] = [];
      }

      transferGroups[r.transferId].push(r);
    }
  });


  return rows.map(r => {

    const enriched = {
      ...r,
      transactionType:
        inferTransactionType(r)
    };


    if (r.transferId) {

      const group =
        transferGroups[r.transferId] || [];

      const counterpart =
        group.find(
          x =>
            x.transactionId !==
            r.transactionId
        );

      if (counterpart) {

        enriched.transferToAccount =
          counterpart.paymentMethod;
      }
    }

    return enriched;
  });
}
