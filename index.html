<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Diligence</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#191b18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap">
<script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<style>
:root{--ink:#191b18;--paper:#f5f5ec;--lime:#dfff00;--coral:#ff8c77;--cyan:#bdedf2;--soft:#b8bbaf;
--bg:#f5f5ec;--card:#fbfbf4;--txt:#191b18;--mut:#66695f;--bd:#cbcec1;--in:#fbfbf4;--ac:#dfff00;--gn:#1b7a3c;--rd:#b8321d;--am:#ff8c77;
--sans:Inter,-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;--gut:16px}
@media(prefers-color-scheme:dark){:root{--bg:#121411;--card:#1b1e1a;--txt:#f5f5ec;--mut:#9a9d92;--bd:#2f322c;--in:#1b1e1a;--gn:#8fe388;--rd:#ff8c77}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--sans)}
.app{max-width:560px;margin:0 auto;min-height:100vh}
.appbar{position:sticky;top:0;z-index:25;height:calc(52px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) var(--gut) 0;background:var(--ink);display:flex;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:8px;flex:1;color:var(--paper);font:700 21px/1 var(--sans);letter-spacing:-.9px}
.appbar .ibtn{width:34px;height:34px;border:1px solid #55584f;border-radius:3px;background:none;color:var(--paper);display:grid;place-items:center;cursor:pointer;padding:0}
.appbar .ibtn.on{background:var(--lime);color:var(--ink);border-color:var(--lime)}
.hd{background:var(--bg);padding:16px var(--gut) 6px;display:flex;align-items:center;gap:10px}
.hd .tt{flex:1;min-width:0}
.hd h1{margin:0;font:600 28px/1 var(--sans);letter-spacing:-1.2px}
.hd .sub{display:block;margin-top:6px;font:500 10px/1.3 var(--mono);letter-spacing:.8px;text-transform:uppercase;color:var(--mut)}
.bk{border:1px solid var(--ln,var(--txt));background:var(--card);color:var(--txt);width:36px;height:36px;border-radius:3px;font-size:22px;line-height:1;padding:0;cursor:pointer}
.ibtn2{width:40px;height:40px;border:1px solid var(--txt);border-radius:3px;background:var(--bg);color:var(--txt);display:grid;place-items:center;cursor:pointer;padding:0}
.ibtn2:disabled{opacity:.6}
.ct{padding:6px var(--gut) calc(96px + env(safe-area-inset-bottom,0px))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:0;padding:12px;margin-top:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.g2 .card{margin:0}
.lb{font:500 10.5px/1.3 var(--mono);letter-spacing:.7px;text-transform:uppercase;color:var(--mut)}
.v{font-size:19px;font-weight:600;margin-top:4px;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.help{font-size:12px;color:var(--mut);margin-top:6px;line-height:1.4}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}
.btn{border:1px solid var(--ink);border-radius:3px;padding:13px 14px;font:600 15px var(--sans);background:var(--lime);color:var(--ink);cursor:pointer}
.btn:disabled{opacity:.5}.btn.gh{background:transparent;color:var(--txt);border-color:var(--txt)}.btn.dg{background:var(--coral);color:var(--ink)}
.sb{flex:none;border:1px solid var(--txt);border-radius:3px;padding:7px 11px;font:600 13px var(--sans);background:transparent;color:var(--txt);cursor:pointer}.sb.dl{color:var(--rd);border-color:var(--rd)}
.fld{margin-top:12px}.fld>label{display:block;font:500 10.5px/1.3 var(--mono);letter-spacing:.7px;text-transform:uppercase;color:var(--mut);margin-bottom:5px}
.pills{display:flex;gap:6px;overflow-x:auto;padding:4px 0;scrollbar-width:none}
.pill{flex:none;border:1px solid var(--txt);border-radius:3px;padding:8px 12px;font:600 13px var(--sans);background:transparent;color:var(--txt);cursor:pointer}
.pill.on{background:var(--lime);color:var(--ink);border-color:var(--ink)}.pill:disabled{opacity:.45}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--bd)}.li:first-of-type{border-top:0}
.li b{font-weight:600}.dot{width:10px;height:10px;border-radius:0;flex:none;border:1px solid var(--ink)}
.up{color:var(--gn)}.dn{color:var(--rd)}.mono{font-family:var(--mono);font-size:11px}
.err{background:var(--coral);color:var(--ink);padding:11px 13px;border-radius:0;margin-top:10px;font-size:14px;border:1px solid var(--ink)}
.ban{background:var(--cyan);color:var(--ink);padding:11px 13px;border-radius:0;margin-top:10px;font-size:14px;border:1px solid var(--ink)}
.chip{display:inline-block;font:500 10.5px var(--mono);background:var(--in);border:1px solid var(--bd);border-radius:3px;padding:3px 7px;margin:6px 6px 0 0}
.badge{font:500 10.5px var(--mono);padding:3px 7px;border-radius:3px;display:inline-block;margin-top:3px;border:1px solid currentColor}
.bar{height:6px;border-radius:0;background:var(--txt);margin-top:5px}
.donut{position:relative;width:210px;max-width:100%;margin:6px auto}.dc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.3}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--ink);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;height:calc(68px + env(safe-area-inset-bottom,0px));padding:0 4px env(safe-area-inset-bottom,0px);z-index:30}
.nb{background:none;border:0;color:var(--soft);display:flex;flex-direction:column;align-items:center;gap:4px;font:500 10px var(--sans);padding:8px 0;cursor:pointer;min-width:0}.nb.on{color:var(--lime)}
.fab{justify-self:center;width:52px;height:42px;border:0;border-radius:3px;background:var(--lime);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(60px + env(safe-area-inset-top,0px));background:var(--ink);color:var(--paper);border:1px solid var(--lime);padding:11px 18px;border-radius:3px;font-weight:600;font-size:14px;z-index:60}.toast.bad{background:var(--coral);color:var(--ink);border-color:var(--ink)}
.shw{position:fixed;inset:0;background:rgba(25,27,24,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;border-top:1px solid var(--txt);padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.sk{height:78px;margin-top:10px;background:linear-gradient(90deg,var(--bd),var(--card),var(--bd));background-size:200% 100%;animation:sk 1.2s infinite}@keyframes sk{to{background-position:-200% 0}}
.tbl{width:100%;border-collapse:collapse;font-size:12px}.tbl td,.tbl th{padding:8px 10px;white-space:nowrap;border-top:1px solid var(--bd);text-align:right}
.tbl td:first-child,.tbl th:first-child{text-align:left;position:sticky;left:0;background:var(--card)}.tbl .tot td{font-weight:700;background:var(--lime);color:var(--ink)}
.pr{filter:blur(7px)}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}.g3 .card{margin:0;padding:10px}
.br{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--bd);font-size:14px}.br:first-of-type{border-top:0}
.sb.on{background:var(--coral);color:var(--ink);border-color:var(--ink)}.sb.ok{background:var(--lime);color:var(--ink);border-color:var(--ink)}
.tx{display:flex;gap:10px;align-items:center;padding:11px 12px;border-top:1px solid var(--bd)}
.cg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.tile{background:var(--card);border-radius:0;padding:10px 9px 9px;cursor:pointer;position:relative;min-width:0;border:1px solid var(--bd)}
.tile.sel{border-color:var(--txt);box-shadow:0 0 0 1px var(--txt);background:var(--lime);color:var(--ink)}.tile.exd{opacity:.6}
.tile .nm{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:20px}
.tile .am{font-size:14px;font-weight:600;margin-top:5px;letter-spacing:-.3px}
.tile .sub{font-size:10px;color:var(--mut);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tile.sel .sub{color:#4a4d46}
.tile .x{position:absolute;top:6px;right:6px;width:18px;height:18px;border-radius:3px;border:1px solid var(--bd);background:var(--in);color:var(--mut);font-size:12px;line-height:16px;padding:0}
.tile .x.on{background:var(--coral);color:var(--ink);border-color:var(--ink)}
.pn{grid-column:1/-1;padding:0;overflow:hidden;margin:0}
.sb.nz{background:var(--cyan);color:var(--ink);border-color:var(--ink)}.sb.nz.on{background:var(--lime);color:var(--ink)}.sb.sm{padding:5px 8px;font-size:10.5px}.sb.am{background:var(--coral);color:var(--ink);border-color:var(--ink)}
.mg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.mc{border:1px solid var(--bd);border-radius:3px;padding:11px 0;font:600 12px var(--sans);background:var(--in);color:var(--txt);cursor:pointer}
.mc.on{background:var(--lime);color:var(--ink);border-color:var(--ink)}.mc.src{outline:2px solid var(--coral)}
/* Overview */
.mono-label{font:500 10.5px/1.3 var(--mono);letter-spacing:.8px;text-transform:uppercase;color:var(--mut)}
.pos-net{background:var(--lime);color:var(--ink);padding:12px 14px 10px;display:flex;flex-direction:column;gap:4px;margin-top:6px}
.pos-net .mono-label{color:var(--ink)}
.pos-top{display:flex;justify-content:space-between;align-items:center}
.pos-amt{font:500 clamp(38px,12.4vw,52px)/1 var(--sans);letter-spacing:-.06em;padding-block:4px;white-space:nowrap;font-variant-numeric:tabular-nums}
.cur{font-size:.56em;letter-spacing:-.04em;margin-left:.18em}
.pos-foot{display:flex;justify-content:space-between;gap:12px;font:400 12px var(--sans)}.pos-foot .mono{font-size:11px}
.pos-split{display:grid;grid-template-columns:1fr 1fr;background:var(--ink);color:var(--paper)}
.pm{padding:11px 14px;display:flex;flex-direction:column;gap:5px;min-width:0}
.pm+.pm{border-left:1px solid var(--mut)}
.pm-h{display:flex;align-items:center;gap:8px}.pm-h .mono-label{color:var(--soft)}
.pm-v{font:400 21px/1.15 var(--sans);letter-spacing:-.8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pm-v .cur{font-size:12px;color:var(--soft);letter-spacing:0}
.pm.debt .pm-v,.pm.debt .pm-v .cur{color:var(--coral)}
.snap{display:grid;grid-template-columns:1fr 1fr;padding-top:8px}
.sn{padding:11px 14px;min-height:100px;display:flex;flex-direction:column;justify-content:space-between;gap:6px;border:1px solid var(--ink);min-width:0;color:var(--ink)}
.sn.exp{background:var(--cyan);border-right:0}.sn.bud{background:var(--coral)}.sn.bud.ok{background:var(--lime)}
.sn .mono-label{color:var(--ink)}
.sn-v{font:400 27px/1 var(--sans);letter-spacing:-1.2px;white-space:nowrap;font-variant-numeric:tabular-nums}.sn-v .cur{font-size:.5em;letter-spacing:0}
.sn .mono{font-size:10.5px;text-transform:uppercase}
.bud-status{display:flex;align-items:center;gap:5px;font:400 10px/1.25 var(--mono);text-transform:uppercase}
.sn.cat{grid-column:1/-1;min-height:0;padding:11px 14px 10px;border-top:0;gap:8px;background:var(--card);color:var(--txt);border-color:var(--txt)}
.sn.cat .mono-label{color:var(--mut)}
.cat-btn{all:unset;box-sizing:border-box;width:100%;display:flex;flex-direction:column;gap:8px;cursor:pointer}
.cat-btn:focus-visible{outline:2px solid var(--txt);outline-offset:4px}
.cat-top{display:flex;justify-content:space-between;align-items:center}
.cat-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.cat-name{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:500}
.cat-amt{font:400 24px var(--sans);letter-spacing:-.8px;font-variant-numeric:tabular-nums}
.cat-chev{display:flex;transition:transform .15s}.sn.cat.open .cat-chev{transform:rotate(180deg)}
.pie-wrap{border-top:1px solid var(--bd);padding-top:10px;display:flex;flex-direction:column}
.pie-svg{width:100%;max-width:250px;height:auto;margin:0 auto;display:block}
.pie-cap{text-align:center;font:500 11px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.5px;padding:8px 0 6px;min-height:30px}
.pie-leg{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:9px 4px;border-top:1px solid var(--bd);cursor:pointer;width:100%;font:400 14px var(--sans);color:var(--txt)}
.pie-leg.on{background:var(--lime);color:var(--ink);font-weight:600}
.pie-leg:focus-visible{outline:2px solid var(--txt);outline-offset:-2px}
.pie-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pie-amt{font-variant-numeric:tabular-nums}
.pie-pct{width:38px;text-align:right;font:400 12px var(--mono);color:var(--mut)}.pie-leg.on .pie-pct{color:var(--ink)}
.cc-head{padding-block:18px 8px}
.cc-head h2{margin:0;font:600 19px/1 var(--sans);letter-spacing:-.6px;display:flex;align-items:baseline;gap:10px}
.cc-head h2 span{font:400 12px var(--mono);letter-spacing:0;color:var(--mut)}
.cc-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--bd)}
.cc-head+.cc-row{border-top:1px solid var(--txt)}
.chipcard{width:31px;height:21px;flex:none;border:1px solid var(--ink);display:flex;align-items:center;padding-left:5px}.chipcard i{width:6px;height:6px;background:var(--ink)}
.cc-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.cc-main b{font:600 15px/1.2 var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-sub{font:400 11px var(--mono);color:var(--mut)}
.cc-lim{font:500 18px var(--sans);letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.cc-end{text-align:right;display:flex;flex-direction:column;gap:2px}
.ov-foot{margin-top:10px;border-top:1px solid var(--txt);padding-top:10px;display:flex;flex-direction:column;gap:3px;font:400 10px var(--mono);color:var(--mut)}

input,select,.box{width:100%;height:46px;background:var(--in);border:1px solid var(--bd);color:var(--txt);padding:0 13px;border-radius:3px;font:400 16px var(--sans);outline:0;-webkit-appearance:none;appearance:none;margin:0}
input[type=checkbox]{width:auto;height:auto}
input[type=date]{display:flex;align-items:center;min-width:0}
input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
input:focus,select:focus,.box:focus,.dd.open>.box{border-color:var(--txt);box-shadow:0 0 0 1px var(--txt)}
.box{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;cursor:pointer}
.dd{position:relative}
.dd-v{display:flex;align-items:center;gap:10px;min-width:0}.dd-v .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{display:flex;transition:transform .15s;color:var(--mut)}.dd.open .chev{transform:rotate(180deg)}
.cc{width:24px;height:16px;flex:none;border:1px solid var(--ink);display:flex;align-items:center;padding-left:4px}.cc i{width:5px;height:5px;background:var(--ink)}
.menu{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:20;background:var(--card);border:1px solid var(--txt);border-radius:3px;max-height:176px;overflow-y:auto;box-shadow:0 8px 20px rgba(25,27,24,.18)}
.opt{display:flex;align-items:center;gap:10px;width:100%;height:36px;padding:0 10px;background:none;border:0;border-top:1px solid var(--bd);color:var(--txt);font:400 14px var(--sans);text-align:left;cursor:pointer}
.opt:first-child{border-top:0}.opt .k{margin-left:auto;font:400 10px var(--mono);letter-spacing:.5px;text-transform:uppercase;color:var(--mut)}
.opt.sel{background:var(--lime);color:var(--ink);font-weight:600}.opt.sel .k{color:var(--ink)}.opt:hover:not(.sel){background:var(--bd)}
.opt:focus-visible,.more-btn:focus-visible,.sw:focus-visible,.ins:focus-visible,.ibtn2:focus-visible,.mbtn:focus-visible,.mo:focus-visible,.acc-b:focus-visible{outline:2px solid var(--txt);outline-offset:2px}
.amount{display:flex;flex-direction:column;align-items:center;gap:6px;padding:28px 0 22px;cursor:text}
.amount .lb{color:var(--mut)}.amount:focus-within .lb{color:var(--txt)}
.amt-line{display:flex;align-items:baseline;justify-content:center;gap:6px;max-width:100%}
.amt-cur{font:500 30px/1 var(--sans);color:var(--mut);letter-spacing:-.04em}
#amt{all:unset;box-sizing:content-box;font:500 52px/1.1 var(--sans);letter-spacing:-.05em;font-variant-numeric:tabular-nums;text-align:center;min-width:2ch;max-width:calc(100vw - 110px);caret-color:var(--txt);color:var(--txt)}
#amt::placeholder{color:var(--bd)}
.amt-rule{width:64px;height:2px;background:var(--bd);transition:background .15s,width .15s}
.amount:focus-within .amt-rule{background:var(--txt);width:96px}
.more{margin-top:18px;border-top:1px solid var(--txt)}
.more-btn{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 0;cursor:pointer;font:600 15px var(--sans)}
.more-btn .r{display:flex;align-items:center;gap:10px}.more.open>.more-btn .chev{transform:rotate(180deg)}
.tag{font:500 10px var(--mono);letter-spacing:.6px;text-transform:uppercase;background:var(--lime);color:var(--ink);border:1px solid var(--ink);border-radius:3px;padding:2px 6px}
.more-body{border-top:1px solid var(--bd);padding-bottom:4px}
.tg{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0 2px;border-top:1px solid var(--bd);margin-top:16px}
.tg b{font:600 15px var(--sans)}.tg .help{display:block;margin-top:3px}
.sw{flex:none;position:relative;width:46px;height:26px;border:1px solid var(--txt);border-radius:3px;background:var(--card);padding:0;cursor:pointer;transition:background .15s;display:block}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;background:var(--txt);border-radius:1px;transition:transform .15s}
.sw[aria-checked="true"]{background:var(--lime);border-color:var(--ink)}.sw[aria-checked="true"]::after{transform:translateX(20px);background:var(--ink)}
.mpick{position:relative;display:flex;align-items:center;gap:6px;margin-top:7px;flex-wrap:wrap}
.mpick .d{font:500 10px/1 var(--mono);letter-spacing:.8px;text-transform:uppercase;color:var(--mut);white-space:nowrap}
.mbtn{width:22px;height:22px;border:1px solid var(--txt);border-radius:3px;background:var(--card);color:var(--txt);display:grid;place-items:center;padding:0;cursor:pointer}
.mbtn svg{transition:transform .15s}.mpick.open .mbtn svg{transform:rotate(180deg)}
.closed{font:500 9px var(--mono);letter-spacing:.6px;text-transform:uppercase;border:1px solid var(--txt);border-radius:3px;padding:2px 5px}
.mmenu{position:absolute;left:0;top:calc(100% + 6px);z-index:30;min-width:210px;background:var(--card);border:1px solid var(--txt);border-radius:3px;box-shadow:0 8px 20px rgba(25,27,24,.18);max-height:222px;overflow-y:auto}
.mo{display:flex;align-items:center;gap:10px;width:100%;height:36px;padding:0 10px;background:none;border:0;border-top:1px solid var(--bd);color:var(--txt);font:400 14px var(--sans);text-align:left;cursor:pointer}
.mo:first-child{border-top:0}.mo .k{margin-left:auto;font:400 10px var(--mono);letter-spacing:.5px;text-transform:uppercase;color:var(--mut)}
.mo.sel{background:var(--lime);color:var(--ink);font-weight:600}.mo.sel .k{color:var(--ink)}.mo:hover:not(.sel){background:var(--bd)}
.tools{display:flex;align-items:flex-end;gap:12px}
.dil{display:flex;flex-direction:column;align-items:center;gap:5px}.dil .mono-label{font-size:9px;letter-spacing:.7px;color:var(--txt)}
